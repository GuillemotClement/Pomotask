services:

  front:
    build: ./front        # Indique à Docker de chercher le Dockerfile dans le dossier actuel
    container_name: bun-front
    restart: unless-stopped
    ports:
      - "5173:5173"  # [Port ordi]:[Port conteneur]
    environment:
      - BACKEND_URL=http://api:3000
    depends_on:
      db:
        condition: service_healthy # Attend que le healthcheck de la DB soit OK

  api:
    build: ./api
    container_name: bun-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - BETTER_AUTH_SECRET=11pFCuW9YKg7oJ8CFEv7iUwMXaoRKz4U
      - BETTER_AUTH_URL=http://api:3000 # Base URL of your app
      - DATABASE_URL=postgres://postgres:postgres@db:5432/todobangbang
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # set shared memory limit when using docker compose
    shm_size: 128mb
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-todobangbang}
    volumes:
      # Persist database data
      - pgdata:/var/lib/postgresql/data
      # Initialize database with SQL script
      # - ../init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      # Check if Postgres is ready to accept connections
      test: ["CMD-SHELL", "pg_isready -U postgres -d todobangbang"]
      start_period: 15s
      interval: 15s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
